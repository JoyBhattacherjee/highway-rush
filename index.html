<title>Highway Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Da+2:wght@700;800&family=Lilita+One&display=swap">
<style>
/* Look: Indian truck art. Cream stickers with thick indigo outlines and hard offset shadows, marigold/hibiscus/teal accents, bunting and marigold trim. Layout: one 16:9 frame; HUD, menus and pads are DOM layers sized by --u (frame width / 900). */
:root{
  --ink:#2a1636;
  --night:#1c1030;
  --cream:#fff4d6;
  --cream-2:#ffe6a3;
  --marigold:#ffb81f;
  --marigold-deep:#d98a00;
  --hibiscus:#ff4f81;
  --teal:#1fc2b5;
  --leaf:#58c56b;
  --sky:#7fd8ff;
  --rust:#e5482f;
  --muted:#7a5c80;
  --font-display:"Lilita One","Baloo 2","Arial Rounded MT Bold","Arial Black",sans-serif;
  --font-ui:"Baloo 2","Trebuchet MS","Segoe UI",Arial,sans-serif;
  --font-bn:"Baloo Da 2","Baloo 2","Noto Sans Bengali","Nirmala UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--cream);font-family:var(--font-ui);font-size:16px;font-weight:600;
  overflow:hidden;overscroll-behavior:none;
  background:radial-gradient(120% 90% at 50% 0%,#4a2670 0%,#2a1450 45%,#190c2c 100%);
  padding:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(var(--cream) 1.4px,transparent 1.6px);background-size:26px 26px}
#root{position:fixed;inset:0}
button{font-family:inherit;font-weight:inherit}
button:focus-visible{outline:calc(var(--u)*3) solid var(--sky);outline-offset:calc(var(--u)*3)}

.frame{position:relative;flex:none;overflow:hidden;background:#111;touch-action:none;
  box-shadow:none}
canvas.stage{display:block;width:100%;height:100%;touch-action:none}

.sticker{background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*14);box-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.lbl{font-size:calc(var(--u)*12);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);pointer-events:none}
.hud[hidden]{display:none}
.rankbox{position:absolute;left:calc(var(--u)*18);top:calc(var(--u)*16);padding:calc(var(--u)*2) calc(var(--u)*18) calc(var(--u)*4);background:var(--marigold);text-align:center}
.rankbox .lbl{color:#7a4a00;line-height:1.2}
.rankbox .num{display:flex;align-items:baseline;justify-content:center;font-family:var(--font-display);line-height:.95}
.rankbox .n{font-size:calc(var(--u)*60)}
.rankbox .o{font-size:calc(var(--u)*24);color:var(--rust);margin-left:calc(var(--u)*2)}
.rankbox .of{font-size:calc(var(--u)*22);color:#7a4a00;margin-left:calc(var(--u)*4)}
.chips{position:absolute;left:calc(var(--u)*18);top:calc(var(--u)*124);display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*7)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*8);padding:calc(var(--u)*1) calc(var(--u)*14);font-family:var(--font-display);font-size:calc(var(--u)*22);line-height:1.35}
.chip.lap b{color:var(--rust);font-weight:400}
.chip svg{width:calc(var(--u)*20);height:calc(var(--u)*20)}
.best{padding:0 calc(var(--u)*10);border-radius:calc(var(--u)*8);background:rgba(42,22,54,.7);font-size:calc(var(--u)*13);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cream)}
.roundbtn{position:absolute;top:calc(var(--u)*16);width:calc(var(--u)*42);height:calc(var(--u)*42);padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;pointer-events:auto;
  background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.roundbtn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.roundbtn svg{width:calc(var(--u)*18);height:calc(var(--u)*18);fill:currentColor}
.pausebtn{right:calc(var(--u)*18)}
.mutebtn{right:calc(var(--u)*18);top:calc(var(--u)*18)}
.mapbox{position:absolute;right:calc(var(--u)*18);top:calc(var(--u)*68);width:calc(var(--u)*190);padding:calc(var(--u)*5) calc(var(--u)*6) calc(var(--u)*6)}
.mapbox .lbl{display:flex;justify-content:space-between;padding:0 calc(var(--u)*4);line-height:1.3}
.mapbox canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:calc(var(--u)*8);background:#fff9e6}
.speedbox{position:absolute;right:calc(var(--u)*18);top:calc(var(--u)*270);width:calc(var(--u)*190);padding:calc(var(--u)*4) calc(var(--u)*12) calc(var(--u)*8);background:var(--teal)}
.speedbox .row1{display:flex;align-items:baseline;justify-content:flex-end;gap:calc(var(--u)*6)}
.speedbox .val{font-family:var(--font-display);font-size:calc(var(--u)*44);line-height:1}
.speedbox .unit{font-size:calc(var(--u)*15);font-weight:800;letter-spacing:.06em;color:#0b5b55}
.bar{height:calc(var(--u)*10);border-radius:calc(var(--u)*6);background:rgba(42,22,54,.28);border:calc(var(--u)*2) solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--marigold),var(--rust))}
.pills{position:absolute;left:50%;bottom:calc(var(--u)*140);transform:translateX(-50%);display:flex;gap:calc(var(--u)*8)}
.pill{padding:calc(var(--u)*1) calc(var(--u)*14);border-radius:calc(var(--u)*999);font-family:var(--font-display);font-size:calc(var(--u)*18);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;
  color:var(--ink);background:var(--marigold);border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*4) 0 var(--ink);animation:pop .25s ease-out}
.pill.sky{background:var(--sky)}
.pill.pink{background:var(--hibiscus);color:#fff}
.banner{position:absolute;left:50%;top:calc(var(--u)*20);transform:translateX(-50%);width:calc(var(--u)*400);padding:calc(var(--u)*6) calc(var(--u)*16) calc(var(--u)*8);text-align:center}
.banner .t{font-family:var(--font-display);font-size:calc(var(--u)*26);line-height:1.1}
.banner .s{font-size:calc(var(--u)*15);font-weight:600;color:var(--muted);line-height:1.2}
.countdown{position:absolute;inset:0;display:grid;place-items:center}
.countdown span{font-family:var(--font-display);font-size:calc(var(--u)*210);line-height:1;color:var(--marigold);-webkit-text-stroke:calc(var(--u)*10) var(--ink);paint-order:stroke fill;
  text-shadow:0 calc(var(--u)*12) 0 var(--ink);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.countdown span.go{color:var(--cream);font-size:calc(var(--u)*190)}

/* controls */
.ctl{position:absolute;display:grid;place-items:center;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;touch-action:none}
.ctl.round{width:calc(var(--u)*92);height:calc(var(--u)*92);bottom:calc(var(--u)*46)}
.ctl.n2o{left:calc(var(--u)*24)}
.ctl.drift{right:calc(var(--u)*24)}
.ctl svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ctl svg.ring circle{fill:none;stroke-width:6}
.ctl svg.ring .bg{stroke:var(--ink)}
.ctl.n2o svg.ring .fg{stroke:var(--sky)}
.ctl.drift svg.ring .fg{stroke:var(--marigold)}
.ctl .face{position:absolute;inset:calc(var(--u)*9);border-radius:50%;border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*4) 0 var(--ink),inset 0 calc(var(--u)*5) 0 rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-size:calc(var(--u)*15);line-height:1;color:var(--ink)}
.ctl.n2o .face{background:radial-gradient(circle at 35% 25%,#c8f0ff,var(--sky) 55%,#3fa9d6)}
.ctl.drift .face{background:radial-gradient(circle at 35% 25%,#ffe9a8,var(--marigold) 55%,var(--marigold-deep))}
.ctl .face svg{width:calc(var(--u)*28);height:calc(var(--u)*28);fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ctl .face svg.fill{fill:var(--ink);stroke:none}
.ctl.held .face,.ctl.on .face{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*1) 0 var(--ink),inset 0 calc(var(--u)*5) 0 rgba(255,255,255,.4)}
.ctl.on{filter:drop-shadow(0 0 calc(var(--u)*10) rgba(255,255,255,.8))}
.keycap{position:absolute;bottom:calc(var(--u)*14);width:calc(var(--u)*92);text-align:center}
.keycap span{display:inline-block;padding:0 calc(var(--u)*10);border-radius:calc(var(--u)*6);background:var(--cream);color:var(--ink);border:calc(var(--u)*2) solid var(--ink);box-shadow:0 calc(var(--u)*3) 0 var(--ink);
  font-size:calc(var(--u)*13);font-weight:800;letter-spacing:.14em}
.keycap.n2o{left:calc(var(--u)*24)}
.keycap.drift{right:calc(var(--u)*24)}
.steer{position:absolute;bottom:calc(var(--u)*46);display:flex}
.steer.l{left:calc(var(--u)*140)}
.steer.r{right:calc(var(--u)*140)}
.arrow{width:calc(var(--u)*92);height:calc(var(--u)*82);display:grid;place-items:center;padding:0;cursor:pointer;pointer-events:auto;touch-action:none;
  background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*18);box-shadow:0 calc(var(--u)*5) 0 var(--ink);opacity:.92}
.arrow.held{transform:translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*1) 0 var(--ink);background:var(--cream-2)}
.arrow svg{width:calc(var(--u)*36);height:calc(var(--u)*36);fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.gas{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*46);width:calc(var(--u)*130);height:calc(var(--u)*82);padding:0;cursor:pointer;pointer-events:auto;touch-action:none;
  background:var(--leaf);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*18);box-shadow:0 calc(var(--u)*5) 0 var(--ink);font-family:var(--font-display);font-size:calc(var(--u)*26)}
.gas.held{transform:translateX(-50%) translateY(calc(var(--u)*4));box-shadow:0 calc(var(--u)*1) 0 var(--ink);background:#7fe08e}
@media (hover:hover) and (pointer:fine){.steer,.gas{display:none}}
@media (hover:none),(pointer:coarse){.keycap{display:none}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*30);padding:calc(var(--u)*58) calc(var(--u)*44) calc(var(--u)*26);pointer-events:auto;overflow:auto;
  background:linear-gradient(180deg,rgba(42,22,54,.2) 0%,rgba(42,22,54,.62) 38%,rgba(28,12,48,.9) 100%)}
.screen{padding-left:max(calc(var(--u)*44),env(safe-area-inset-left,0px));padding-right:max(calc(var(--u)*44),env(safe-area-inset-right,0px))}
.bunting{position:absolute;left:0;top:0;width:100%;height:calc(var(--u)*64);pointer-events:none;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
.col{display:flex;flex-direction:column;gap:calc(var(--u)*12);min-width:0}
.col.left{flex:1 1 46%;align-items:flex-start;max-width:calc(var(--u)*470)}
.col.right{flex:1 1 54%;max-width:calc(var(--u)*540)}
.kicker{display:inline-block;padding:0 calc(var(--u)*12);border-radius:calc(var(--u)*999);background:var(--teal);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*3) 0 var(--ink);
  font-size:calc(var(--u)*14);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.title{margin:0;display:flex;flex-direction:column;font-family:var(--font-display);font-weight:400;font-size:calc(var(--u)*80);line-height:.88;text-transform:uppercase;color:var(--cream);
  -webkit-text-stroke:calc(var(--u)*7) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*7) 0 var(--ink)}
.title .accent{color:var(--marigold)}
.title.mid{font-size:calc(var(--u)*58)}
.title.bad{color:var(--rust)}
.bn{display:inline-block;transform:rotate(-2deg);padding:0 calc(var(--u)*18);border-radius:calc(var(--u)*999);background:var(--hibiscus);color:var(--cream);border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*4) 0 var(--ink);
  font-family:var(--font-bn);font-weight:800;font-size:calc(var(--u)*28);line-height:1.5}
.tagline{margin:0;max-width:calc(var(--u)*390);font-size:calc(var(--u)*18);font-weight:600;line-height:1.25;color:var(--cream);text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.45)}
.setrow{display:flex;gap:calc(var(--u)*18);flex-wrap:wrap}
.group{display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.group .lbl{color:var(--cream);opacity:.85}
.seg{display:inline-flex;overflow:hidden;background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*12);box-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:calc(var(--u)*3) calc(var(--u)*16);font-size:calc(var(--u)*17);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.seg button+button{border-left:calc(var(--u)*3) solid var(--ink)}
.seg button[aria-checked="true"]{background:var(--marigold)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*18)}
.card{position:relative;appearance:none;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);min-width:0;cursor:pointer;text-align:center;
  background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*20);box-shadow:0 calc(var(--u)*6) 0 var(--ink);padding:calc(var(--u)*10) calc(var(--u)*12) calc(var(--u)*12);transition:transform .15s}
.card.sel{background:var(--cream-2);transform:translateY(calc(var(--u)*-5)) rotate(-1.2deg);box-shadow:0 calc(var(--u)*11) 0 var(--ink),0 0 0 calc(var(--u)*5) var(--marigold)}
.card:nth-child(2).sel{transform:translateY(calc(var(--u)*-5)) rotate(1.2deg)}
.badge{position:absolute;top:calc(var(--u)*-14);right:calc(var(--u)*-8);transform:rotate(8deg);padding:0 calc(var(--u)*10);border-radius:calc(var(--u)*999);background:var(--hibiscus);color:#fff;border:calc(var(--u)*3) solid var(--ink);
  font-family:var(--font-display);font-size:calc(var(--u)*14);letter-spacing:.04em;text-transform:uppercase}
.prev{display:block;width:100%;aspect-ratio:5/4;border-radius:calc(var(--u)*12);border:calc(var(--u)*3) solid var(--ink)}
.cname{font-family:var(--font-display);font-size:calc(var(--u)*25);line-height:1}
.cblurb{min-height:3.3em;font-size:calc(var(--u)*14.5);font-weight:600;line-height:1.15;color:var(--muted)}
.stat{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:calc(var(--u)*12.5);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pips{display:inline-flex;gap:calc(var(--u)*3)}
.pips i{display:block;width:calc(var(--u)*15);height:calc(var(--u)*9);background:#e9d8ac;border:calc(var(--u)*2) solid var(--ink);border-radius:calc(var(--u)*3)}
.pips i.on{background:var(--marigold)}
.btn{appearance:none;cursor:pointer;border-radius:calc(var(--u)*16);padding:calc(var(--u)*5) calc(var(--u)*30) calc(var(--u)*7);font-family:var(--font-display);font-size:calc(var(--u)*30);letter-spacing:.02em;text-transform:uppercase;
  border:calc(var(--u)*4) solid var(--ink);box-shadow:0 calc(var(--u)*7) 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(calc(var(--u)*-2))}
.btn:active{transform:translateY(calc(var(--u)*5));box-shadow:0 calc(var(--u)*2) 0 var(--ink)}
.btn.go{background:var(--marigold);color:var(--ink);display:inline-flex;align-items:center;gap:calc(var(--u)*10)}
.btn.go svg{width:calc(var(--u)*28);height:calc(var(--u)*28);fill:var(--ink)}
.btn.ghost{background:var(--cream);color:var(--ink);font-size:calc(var(--u)*20);padding:calc(var(--u)*6) calc(var(--u)*22) calc(var(--u)*7);box-shadow:0 calc(var(--u)*5) 0 var(--ink)}
.row{display:flex;gap:calc(var(--u)*14);align-items:center;flex-wrap:wrap}
.hint{font-size:calc(var(--u)*15);font-weight:600;line-height:1.35;color:var(--cream);opacity:.92}
.hint b{color:var(--marigold);font-weight:800}
.rotate{display:none;font-size:calc(var(--u)*15);color:var(--marigold);font-weight:800}
@media (max-aspect-ratio:1/1){.rotate{display:block}}

.winwrap{position:relative;display:flex;align-items:center;justify-content:center;width:calc(var(--u)*280);height:calc(var(--u)*210)}
.burst{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite}
.place{position:relative;font-family:var(--font-display);font-size:calc(var(--u)*118);line-height:1;color:var(--cream);-webkit-text-stroke:calc(var(--u)*9) var(--ink);paint-order:stroke fill;text-shadow:0 calc(var(--u)*8) 0 var(--ink)}
.place small{font-size:.3em;margin-left:calc(var(--u)*6);color:var(--marigold)}
.bigtime{font-family:var(--font-display);font-size:calc(var(--u)*38);text-shadow:0 calc(var(--u)*4) 0 var(--ink)}
.newbest{padding:0 calc(var(--u)*12);border-radius:calc(var(--u)*999);background:var(--sky);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);box-shadow:0 calc(var(--u)*3) 0 var(--ink);
  font-family:var(--font-display);font-size:calc(var(--u)*16);text-transform:uppercase}
.board{padding:calc(var(--u)*8) calc(var(--u)*12)}
.table{width:100%;border-collapse:collapse;font-size:calc(var(--u)*18)}
.table td{padding:calc(var(--u)*3) calc(var(--u)*6);border-bottom:calc(var(--u)*2) dashed rgba(42,22,54,.2);font-weight:700}
.table tr:last-child td{border-bottom:0}
.table tr.me td{background:var(--marigold)}
.table td.pos{width:calc(var(--u)*44)}
.table td.t{text-align:right;font-variant-numeric:tabular-nums}
.medal{display:inline-grid;place-items:center;width:calc(var(--u)*28);height:calc(var(--u)*28);border-radius:50%;border:calc(var(--u)*2.5) solid var(--ink);background:#eadbb4;font-family:var(--font-display);font-size:calc(var(--u)*16)}
.medal.g1{background:#ffd23f}.medal.g2{background:#d8dde6}.medal.g3{background:#e49a5c}
.dot{display:inline-block;width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;margin-right:calc(var(--u)*8);vertical-align:middle;border:calc(var(--u)*2.5) solid var(--ink)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-6%;display:block;animation:fall linear infinite}

@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sway{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
/* ===================== Race engine (pseudo-3D canvas, no React) ===================== */
(function () {
"use strict";
const W = 960; let H = 540, HZ = Math.round(H * 0.36); const VS = 270, SC = 0.65;
const SEG = 200, ROAD = 2000, RUMBLE = 3, LANES = 4;
const CAM_H = 1700, FOV = 100, DRAW = 170, FOG = 3.2, CENTRIF = 0.3;
const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * CAM_DEPTH;
const FOGC = "#ffb877", OL = "#2a1636";

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, b) => ((a % b) + b) % b;
const easeIn = (a, b, p) => a + (b - a) * p * p;

        e("button", { className: "btn go", onClick: props.onAgain }, "Race again"),
        e("button", { className: "btn ghost", onClick: props.onMenu }, "Menu"))),
    e("div", { className: "col right" },
      e("div", { className: "board sticker" }, e("table", { className: "table" }, e("tbody", null,
        r.standings.map(function (s, i) {
          return e("tr", { key: i, className: s.me ? "me" : "" },
            e("td", { className: "pos" }, e("span", { className: "medal" + (i < 3 ? " g" + (i + 1) : "") }, i + 1)),
            e("td", null, e("span", { className: "dot", style: { background: s.color } }), s.me ? "You" : s.name),
            e("td", { className: "t" }, fmtTime(s.time)));
        }))))));
}

function App() {
  const [screen, setScreen] = useState("menu");
  const [kind, setKind] = useState("classic");
  const [diff, setDiff] = useState("normal");
  const [laps, setLaps] = useState(3);
  const [hud, setHud] = useState(INIT_HUD);
  const [result, setResult] = useState(null);
  const [best, setBest] = useState(function () { return loadBest(3); });
  const [muted, setMuted] = useState(false);
  const [size, setSize] = useState({ w: 860, h: 484 });
  const stageRef = useRef(null), canvasRef = useRef(null), miniRef = useRef(null), gameRef = useRef(null);
  const screenRef = useRef(screen), act = useRef({});
  screenRef.current = screen;

  useEffect(function () { setBest(loadBest(laps)); }, [laps]);

  useEffect(function () {
    const g = HR.createGame(canvasRef.current, miniRef.current, {
      onHud: function (s) { setHud(s); },
      onFinish: function (info) {
        const prev = loadBest(info.laps), isBest = prev === 0 || info.time < prev;
        if (isBest) { saveBest(info.laps, info.time); setBest(info.time); }
        setResult(Object.assign({}, info, { isBest: isBest }));
        setScreen("over");
      }
    });
    gameRef.current = g;
    return function () { g.destroy(); gameRef.current = null; };
  }, []);

  useLayoutEffect(function () {
    const el = stageRef.current; if (!el) return;
    function measure() {
      const r = el.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      const w = Math.floor(r.width), h = Math.floor(r.height);
      setSize(function (p) { return p.w === w && p.h === h ? p : { w: w, h: h }; });
    }
    measure();
    let ro = null; if (window.ResizeObserver) { ro = new ResizeObserver(measure); ro.observe(el); }
    window.addEventListener("resize", measure);
    return function () { if (ro) ro.disconnect(); window.removeEventListener("resize", measure); };
  }, []);
  useEffect(function () { if (gameRef.current) gameRef.current.resize(size.w, size.h); }, [size.w, size.h]);

  function start() {
    const g = gameRef.current; if (!g) return;
    setHud(Object.assign({}, INIT_HUD, { laps: laps }));
    g.start({ kind: kind, diff: diff, laps: laps }); setScreen("race");
  }
  function pause() { const g = gameRef.current; if (g && screenRef.current === "race") { g.pause(); setScreen("pause"); } }
  function resume() { const g = gameRef.current; if (g && screenRef.current === "pause") { g.resume(); setScreen("race"); } }
  function toMenu() { const g = gameRef.current; if (g) { g.resume(); g.toMenu(); } setScreen("menu"); }
  function toggleMute() { const m = !muted; setMuted(m); if (gameRef.current) gameRef.current.setMuted(m); }
  act.current = { start: start, pause: pause, resume: resume, toggleMute: toggleMute };

  useEffect(function () {
    function onKey(ev) {
      const s = screenRef.current, k = ev.key, onBtn = ev.target && ev.target.tagName === "BUTTON";
      if (k === "p" || k === "P" || k === "Escape") { if (s === "race") act.current.pause(); else if (s === "pause") act.current.resume(); }
      else if (k === "m" || k === "M") act.current.toggleMute();
      else if (k === "Enter" && !onBtn && (s === "menu" || s === "over")) act.current.start();
    }
    function onHide() { if (document.hidden) act.current.pause(); }
    window.addEventListener("keydown", onKey); window.addEventListener("blur", onHide); document.addEventListener("visibilitychange", onHide);
    return function () { window.removeEventListener("keydown", onKey); window.removeEventListener("blur", onHide); document.removeEventListener("visibilitychange", onHide); };
  }, []);

  return e("div", { ref: stageRef, style: { height: "100%", width: "100%", display: "flex", alignItems: "center", justifyContent: "center", minWidth: 0 } },
    e("div", { className: "frame", style: { width: size.w, height: size.h, "--u": Math.max(0.4, Math.min(size.w / 900, size.h / 506)) + "px" }, onContextMenu: function (ev) { ev.preventDefault(); } },
      e("canvas", { ref: canvasRef, className: "stage", role: "img", "aria-label": "Highway Rush race view" }),
      e(Hud, { hud: hud, game: gameRef, onPause: pause, miniRef: miniRef, best: best, hidden: screen !== "race" && screen !== "pause" }),
      screen === "menu" ? e(Menu, { kind: kind, setKind: setKind, diff: diff, setDiff: setDiff, laps: laps, setLaps: setLaps, onStart: start, best: best, muted: muted, onMute: toggleMute }) : null,
      screen === "pause" ? e(Paused, { muted: muted, onMute: toggleMute, onResume: resume, onQuit: toMenu }) : null,
      screen === "over" && result ? e(Over, { result: result, best: best, onAgain: start, onMenu: toMenu }) : null));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>
